<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
 
 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
 
<body>

  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="col-12 col-sm-8 col-md-5">
 
  
      <div class="card shadow-sm p-4">
 
    
        <h2 class="text-center mb-4">Login</h2>
 
       
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Digite seu email" />
        </div>
 
        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" id="senha" class="form-control" placeholder="Digite sua senha" />
        </div>
 
        <button type="button" class="btn btn-primary w-100 mt-2" onclick="realizarLogin()">
          Entrar
        </button>
 
        <p class="text-center mt-3 mb-0">
          Não tem conta? <a href="#">Cadastre-se</a>
        </p>
 
      </div>
    </div>
  </div>
 

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="script.js"></script>
 
</body>
</html>
